# SQLQuest — full stack.
#
#   docker compose up --build
#   → http://localhost:3000
#
# The app is usable without Postgres (progress is stored in the browser); the
# database here backs accounts, cross-device sync and the leaderboard.

name: sqlquest

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sqlquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqlquest}
      POSTGRES_DB: ${POSTGRES_DB:-sqlquest}
      # Faster, deterministic collation for a container that's recreated often.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed for drizzle-kit studio and psql from the host.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sqlquest} -d ${POSTGRES_DB:-sqlquest}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: builder
    command: npx drizzle-kit push --force
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sqlquest}:${POSTGRES_PASSWORD:-sqlquest}@db:5432/${POSTGRES_DB:-sqlquest}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sqlquest}:${POSTGRES_PASSWORD:-sqlquest}@db:5432/${POSTGRES_DB:-sqlquest}
      # Generate a real one with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — run "openssl rand -base64 32"}
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
